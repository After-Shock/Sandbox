---
- name: Repair validated JellyGlance secret permissions
  ansible.builtin.file:
    path: "{{ item }}"
    state: file
    mode: "0600"
    owner: "{{ user.name }}"
    group: "{{ user.name }}"
  loop: "{{ jellyglance_secret_modes_to_repair }}"
  no_log: true

- name: Initialize an empty JellyGlance secret pair
  when: jellyglance_state_is_new and jellyglance_neither_secret_exists
  block:
    - name: Initialize JellyGlance secret installation ownership
      ansible.builtin.set_fact:
        jellyglance_installed_secret_paths: []
        jellyglance_secret_init_lock_owned: false
      no_log: true

    - name: Create JellyGlance secret parent directory
      ansible.builtin.file:
        path: "{{ lookup('role_var', '_paths_location', role='jellyglance') }}"
        state: directory
        mode: "0700"
        owner: "{{ user.name }}"
        group: "{{ user.name }}"
      no_log: true

    - name: Resolve JellyGlance secret parent directory
      ansible.builtin.command:
        argv:
          - /usr/bin/readlink
          - -f
          - "{{ lookup('role_var', '_paths_location', role='jellyglance') }}"
      register: jellyglance_secret_parent_resolution
      changed_when: false
      no_log: true

    - name: Record resolved JellyGlance secret parent directory
      ansible.builtin.set_fact:
        jellyglance_secret_parent_resolved: "{{ jellyglance_secret_parent_resolution.stdout }}"
      no_log: true

    - name: Create JellyGlance secret staging directory
      ansible.builtin.tempfile:
        path: "{{ jellyglance_secret_parent_resolved }}"
        prefix: .secret-stage-
        state: directory
      register: jellyglance_secret_stage
      no_log: true

    - name: Inspect JellyGlance secret staging directory
      ansible.builtin.stat:
        path: "{{ jellyglance_secret_stage.path }}"
        follow: false
      register: jellyglance_secret_stage_stat
      no_log: true

    - name: Validate JellyGlance secret staging location
      ansible.builtin.assert:
        that:
          - jellyglance_secret_stage_stat.stat.exists
          - jellyglance_secret_stage_stat.stat.isdir
          - not jellyglance_secret_stage_stat.stat.islnk
          - jellyglance_secret_stage.path is regex('^' + (jellyglance_secret_parent_resolved | regex_escape) + '/\.secret-stage-[^/]+$')
        fail_msg: JellyGlance secret staging location invalid
      no_log: true

    - name: Secure JellyGlance secret staging directory
      ansible.builtin.file:
        path: "{{ jellyglance_secret_stage.path }}"
        state: directory
        mode: "0700"
        owner: "{{ user.name }}"
        group: "{{ user.name }}"
      no_log: true

    - name: Select deterministic JellyGlance test secrets
      ansible.builtin.set_fact:
        jellyglance_staged_jwt_secret: "{{ jellyglance_test_init_jwt_secret }}"
        jellyglance_staged_postgres_password: "{{ jellyglance_test_init_postgres_password }}"
      when: jellyglance_test_mode and (continuous_integration | default(false) | bool)
      no_log: true

    - name: Generate production JellyGlance JWT secret
      ansible.builtin.command:
        argv:
          - /usr/bin/openssl
          - rand
          - -hex
          - "32"
      register: jellyglance_generated_jwt
      changed_when: true
      when: not jellyglance_test_mode
      no_log: true

    - name: Generate production JellyGlance PostgreSQL secret
      ansible.builtin.command:
        argv:
          - /usr/bin/openssl
          - rand
          - -hex
          - "32"
      register: jellyglance_generated_postgres
      changed_when: true
      when: not jellyglance_test_mode
      no_log: true

    - name: Select generated JellyGlance production secrets
      ansible.builtin.set_fact:
        jellyglance_staged_jwt_secret: "{{ jellyglance_generated_jwt.stdout }}"
        jellyglance_staged_postgres_password: "{{ jellyglance_generated_postgres.stdout }}"
      when: not jellyglance_test_mode
      no_log: true

    - name: Validate staged JellyGlance secrets
      ansible.builtin.assert:
        that:
          - jellyglance_staged_jwt_secret is regex('^[0-9a-f]{64}$')
          - jellyglance_staged_postgres_password is regex('^[0-9a-f]{64}$')
          - jellyglance_staged_jwt_secret != jellyglance_staged_postgres_password
        fail_msg: malformed staged secret format or encoding
      no_log: true

    - name: Write staged JellyGlance secrets
      ansible.builtin.copy:
        content: "{{ item.value }}\n"
        dest: "{{ jellyglance_secret_stage.path }}/{{ item.name }}"
        mode: "0600"
        owner: "{{ user.name }}"
        group: "{{ user.name }}"
      loop:
        - name: jwt_secret.txt
          value: "{{ jellyglance_staged_jwt_secret }}"
        - name: postgres_password.txt
          value: "{{ jellyglance_staged_postgres_password }}"
      no_log: true

    - name: Read staged JellyGlance secrets for final validation
      ansible.builtin.slurp:
        src: "{{ jellyglance_secret_stage.path }}/{{ item }}"
      loop:
        - jwt_secret.txt
        - postgres_password.txt
      register: jellyglance_staged_contents
      no_log: true

    - name: Require valid staged JellyGlance file contents
      ansible.builtin.assert:
        that:
          - jellyglance_staged_contents.results[0].content | b64decode | length == 65
          - jellyglance_staged_contents.results[1].content | b64decode | length == 65
          - (jellyglance_staged_contents.results[0].content | b64decode) is regex('^[0-9a-f]{64}\n$')
          - (jellyglance_staged_contents.results[1].content | b64decode) is regex('^[0-9a-f]{64}\n$')
        fail_msg: malformed staged secret file encoding
      no_log: true

    - name: Exclusively acquire JellyGlance secret initialization lock
      ansible.builtin.command:
        argv:
          - /usr/bin/mkdir
          - "{{ jellyglance_secret_parent_resolved }}/.secret-init.lock"
      changed_when: true
      no_log: true

    - name: Record JellyGlance secret initialization lock ownership
      ansible.builtin.set_fact:
        jellyglance_secret_init_lock_owned: true
      no_log: true

    - name: Exclusively install JellyGlance JWT secret
      ansible.builtin.command:
        argv:
          - /usr/bin/ln
          - "{{ jellyglance_secret_stage.path }}/jwt_secret.txt"
          - "{{ lookup('role_var', '_paths_jwt_secret_file', role='jellyglance') }}"
      changed_when: true
      no_log: true

    - name: Record owned JellyGlance JWT installation
      ansible.builtin.set_fact:
        jellyglance_installed_secret_paths: >-
          {{ jellyglance_installed_secret_paths
             + [lookup('role_var', '_paths_jwt_secret_file', role='jellyglance')] }}
      no_log: true

    - name: Inject CI-only JellyGlance second-install failure
      ansible.builtin.fail:
        msg: JellyGlance test fault after first exclusive install
      when:
        - jellyglance_test_mode
        - continuous_integration | default(false) | bool
        - jellyglance_test_fail_second_install | default(false) | bool
      no_log: true

    - name: Exclusively install JellyGlance PostgreSQL secret
      ansible.builtin.command:
        argv:
          - /usr/bin/ln
          - "{{ jellyglance_secret_stage.path }}/postgres_password.txt"
          - "{{ lookup('role_var', '_paths_postgres_password_file', role='jellyglance') }}"
      changed_when: true
      no_log: true

    - name: Record owned JellyGlance PostgreSQL installation
      ansible.builtin.set_fact:
        jellyglance_installed_secret_paths: >-
          {{ jellyglance_installed_secret_paths
             + [lookup('role_var', '_paths_postgres_password_file', role='jellyglance')] }}
      no_log: true

    - name: Publish initialized JellyGlance secret facts
      ansible.builtin.set_fact:
        jellyglance_jwt_secret: "{{ jellyglance_staged_jwt_secret }}"
        jellyglance_postgres_password: "{{ jellyglance_staged_postgres_password }}"
      no_log: true
  rescue:
    - name: Probe JellyGlance state content after initialization failure
      ansible.builtin.command:
        argv:
          - /usr/bin/find
          - "{{ item }}"
          - -mindepth
          - "1"
          - -maxdepth
          - "1"
          - -print
          - -quit
      loop:
        - "{{ lookup('role_var', '_paths_config_location', role='jellyglance') }}"
        - "{{ lookup('role_var', '_paths_backups_location', role='jellyglance') }}"
        - "{{ lookup('role_var', '_paths_postgres_location', role='jellyglance') }}"
      register: jellyglance_rescue_state
      changed_when: false
      failed_when: false
      no_log: true

    - name: Remove owned partial JellyGlance secrets while state remains empty
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop: "{{ jellyglance_installed_secret_paths | default([]) }}"
      when: jellyglance_rescue_state.results | map(attribute='stdout') | select('string') | reject('equalto', '') | list | length == 0
      no_log: true

    - name: Report redacted JellyGlance secret initialization failure
      ansible.builtin.fail:
        msg: JellyGlance secret pair initialization failed
      no_log: true
  always:
    - name: Inspect registered JellyGlance secret staging directory for cleanup
      ansible.builtin.stat:
        path: "{{ jellyglance_secret_stage.path }}"
        follow: false
      register: jellyglance_secret_stage_cleanup_stat
      when:
        - jellyglance_secret_stage is defined
        - jellyglance_secret_stage.path is defined
      no_log: true

    - name: Remove validated JellyGlance secret staging directory
      ansible.builtin.file:
        path: "{{ jellyglance_secret_stage.path }}"
        state: absent
      when:
        - jellyglance_secret_stage_cleanup_stat is defined
        - not (jellyglance_secret_stage_cleanup_stat.skipped | default(false))
        - jellyglance_secret_stage_cleanup_stat.stat.exists
        - jellyglance_secret_stage_cleanup_stat.stat.isdir
        - not jellyglance_secret_stage_cleanup_stat.stat.islnk
        - jellyglance_secret_parent_resolved is defined
        - jellyglance_secret_stage.path is regex('^' + (jellyglance_secret_parent_resolved | regex_escape) + '/\.secret-stage-[^/]+$')
      no_log: true

    - name: Release owned JellyGlance secret initialization lock
      ansible.builtin.file:
        path: "{{ jellyglance_secret_parent_resolved }}/.secret-init.lock"
        state: absent
      when: jellyglance_secret_init_lock_owned | default(false) | bool
      no_log: true

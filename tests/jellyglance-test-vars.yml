---
continuous_integration: true
jellyglance_test_mode: true
jellyglance_rollback_only: false

user:
  name: "{{ lookup('env', 'USER') }}"
  domain: example.invalid
tz: Etc/UTC
dns_proxied: false
skip_dns: true
cloudflare_records_enabled: false
role_dns_enabled: false
cloudflare:
  email: nobody@example.invalid
  api: inert-test-token

docker_network_name_common: saltbox
traefik_default_middleware: ""
traefik_default_middleware_http: ""
traefik_default_certresolver: letsencrypt
traefik_entrypoint_web: web
traefik_entrypoint_websecure: websecure
resources_tasks_path: /nonexistent/jellyglance-test-resources

jellyglance_test_dns_records: []
dns_ipv4_enabled: true
dns_ipv6_enabled: true
ipv4_address_public_template: 192.0.2.10
ipv6_address_public_template: 2001:db8::10
jellyglance_test_jellyfin_metadata:
  name: jellyfin
  id: inert-jellyfin-container-id
  image: jellyfin/jellyfin:test-fixture
  started_at: "2000-01-01T00:00:00Z"
  running: true
  health: healthy

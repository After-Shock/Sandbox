---
- name: Exercise JellyGlance secret-state contracts
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - jellyglance-test-vars.yml
  vars:
    jellyglance_scenario_root: "{{ jellyglance_test_root }}/{{ jellyglance_scenario }}"
    jellyglance_secret_root: "{{ jellyglance_scenario_root }}/jellyglance"
    jellyglance_jwt_path: "{{ jellyglance_secret_root }}/jwt_secret.txt"
    jellyglance_postgres_path: "{{ jellyglance_secret_root }}/postgres_password.txt"
  pre_tasks:
    - name: Require runner-provided temporary root
      ansible.builtin.assert:
        that:
          - jellyglance_test_root is defined
          - jellyglance_test_root | length > 10
          - jellyglance_test_root is regex('^/[^/]+/.+')
        fail_msg: jellyglance_test_root must be an absolute temporary test path

    - name: Initialize behavioral test root
      ansible.builtin.file:
        path: "{{ jellyglance_test_root }}"
        state: directory
        mode: "0700"

  tasks:
    - name: Scenario 1 - prepare empty state
      ansible.builtin.set_fact:
        jellyglance_scenario: empty

    - name: Scenario 1 - create evidence directory outside application state
      ansible.builtin.file:
        path: "{{ jellyglance_scenario_root }}/evidence"
        state: directory
        mode: "0700"

    - name: Scenario 1 - empty state creates both secrets
      ansible.builtin.include_role:
        name: jellyglance
        tasks_from: "{{ jellyglance_test_phase.file }}"
        apply:
          no_log: "{{ jellyglance_test_phase.no_log }}"
      loop:
        - file: preflight
          no_log: false
        - file: secrets
          no_log: true
      loop_control:
        loop_var: jellyglance_test_phase
      vars:
        server_appdata_path: "{{ jellyglance_scenario_root }}"
        jellyglance_evidence_dir: "{{ jellyglance_scenario_root }}/evidence"
        jellyglance_test_init_jwt_secret: "{{ jellyglance_fixture_init_jwt_secret }}"
        jellyglance_test_init_postgres_password: "{{ jellyglance_fixture_init_postgres_password }}"

    - name: Scenario 1 - inspect generated secrets
      ansible.builtin.stat:
        path: "{{ item }}"
        checksum_algorithm: sha256
        follow: false
      loop:
        - "{{ jellyglance_jwt_path }}"
        - "{{ jellyglance_postgres_path }}"
      register: jellyglance_empty_stats
      no_log: true

    - name: Scenario 1 - read generated secrets for format validation
      ansible.builtin.slurp:
        src: "{{ item }}"
      loop:
        - "{{ jellyglance_jwt_path }}"
        - "{{ jellyglance_postgres_path }}"
      register: jellyglance_empty_contents
      no_log: true

    - name: Scenario 1 - require two valid private secrets
      ansible.builtin.assert:
        that:
          - jellyglance_empty_stats.results | length == 2
          - jellyglance_empty_stats.results[0].stat.isreg
          - jellyglance_empty_stats.results[1].stat.isreg
          - jellyglance_empty_stats.results[0].stat.mode == '0600'
          - jellyglance_empty_stats.results[1].stat.mode == '0600'
          - (jellyglance_empty_contents.results[0].content | b64decode) is regex('^[0-9a-f]{64}\n$')
          - (jellyglance_empty_contents.results[1].content | b64decode) is regex('^[0-9a-f]{64}\n$')
          - (jellyglance_empty_contents.results[0].content | b64decode) != (jellyglance_empty_contents.results[1].content | b64decode)
          - (jellyglance_empty_contents.results[0].content | b64decode | trim) == jellyglance_fixture_init_jwt_secret
          - (jellyglance_empty_contents.results[1].content | b64decode | trim) == jellyglance_fixture_init_postgres_password
        fail_msg: empty state did not create two distinct valid mode-0600 secrets
      no_log: true

    - name: Scenario 2 - retain first-run secret hashes
      ansible.builtin.set_fact:
        jellyglance_empty_hashes_before:
          - "{{ jellyglance_empty_stats.results[0].stat.checksum }}"
          - "{{ jellyglance_empty_stats.results[1].stat.checksum }}"

    - name: Scenario 2 - rerun role against initialized state
      ansible.builtin.include_role:
        name: jellyglance
        tasks_from: "{{ jellyglance_test_phase.file }}"
        apply:
          no_log: "{{ jellyglance_test_phase.no_log }}"
      loop:
        - file: preflight
          no_log: false
        - file: secrets
          no_log: true
      loop_control:
        loop_var: jellyglance_test_phase
      vars:
        server_appdata_path: "{{ jellyglance_scenario_root }}"
        jellyglance_evidence_dir: "{{ jellyglance_scenario_root }}/evidence"
        jellyglance_test_init_jwt_secret: "{{ jellyglance_fixture_init_jwt_secret }}"
        jellyglance_test_init_postgres_password: "{{ jellyglance_fixture_init_postgres_password }}"

    - name: Scenario 2 - inspect rerun secret hashes
      ansible.builtin.stat:
        path: "{{ item }}"
        checksum_algorithm: sha256
        follow: false
      loop:
        - "{{ jellyglance_jwt_path }}"
        - "{{ jellyglance_postgres_path }}"
      register: jellyglance_empty_rerun_stats

    - name: Scenario 2 - rerun must reuse both secrets
      ansible.builtin.assert:
        that:
          - jellyglance_empty_rerun_stats.results[0].stat.checksum == jellyglance_empty_hashes_before[0]
          - jellyglance_empty_rerun_stats.results[1].stat.checksum == jellyglance_empty_hashes_before[1]
          - jellyglance_empty_rerun_stats.results[0].stat.mode == '0600'
          - jellyglance_empty_rerun_stats.results[1].stat.mode == '0600'
        fail_msg: rerun changed a persistent secret or its private mode

    - name: Scenario 3 - select interrupted-empty state
      ansible.builtin.set_fact:
        jellyglance_scenario: interrupted

    - name: Scenario 3 - create empty-state and evidence directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0700"
      loop:
        - "{{ jellyglance_secret_root }}"
        - "{{ jellyglance_scenario_root }}/evidence"

    - name: Scenario 3 - seed both valid interrupted secrets
      ansible.builtin.copy:
        content: "{{ item.value }}\n"
        dest: "{{ item.path }}"
        mode: "0600"
      loop:
        - path: "{{ jellyglance_jwt_path }}"
          value: "{{ jellyglance_interrupted_jwt }}"
        - path: "{{ jellyglance_postgres_path }}"
          value: "{{ jellyglance_interrupted_postgres }}"
      no_log: true

    - name: Scenario 3 - hash interrupted secrets before role run
      ansible.builtin.stat:
        path: "{{ item }}"
        checksum_algorithm: sha256
      loop:
        - "{{ jellyglance_jwt_path }}"
        - "{{ jellyglance_postgres_path }}"
      register: jellyglance_interrupted_before

    - name: Scenario 3 - reuse both valid interrupted secrets
      ansible.builtin.include_role:
        name: jellyglance
        tasks_from: "{{ jellyglance_test_phase.file }}"
        apply:
          no_log: "{{ jellyglance_test_phase.no_log }}"
      loop:
        - file: preflight
          no_log: false
        - file: secrets
          no_log: true
      loop_control:
        loop_var: jellyglance_test_phase
      vars:
        server_appdata_path: "{{ jellyglance_scenario_root }}"
        jellyglance_evidence_dir: "{{ jellyglance_scenario_root }}/evidence"

    - name: Scenario 3 - hash interrupted secrets after role run
      ansible.builtin.stat:
        path: "{{ item }}"
        checksum_algorithm: sha256
      loop:
        - "{{ jellyglance_jwt_path }}"
        - "{{ jellyglance_postgres_path }}"
      register: jellyglance_interrupted_after

    - name: Scenario 3 - interrupted initialization must preserve both values
      ansible.builtin.assert:
        that:
          - jellyglance_interrupted_after.results[0].stat.checksum == jellyglance_interrupted_before.results[0].stat.checksum
          - jellyglance_interrupted_after.results[1].stat.checksum == jellyglance_interrupted_before.results[1].stat.checksum
        fail_msg: valid interrupted-state secrets were replaced

    - name: Scenario 4a - select exactly-one-secret state
      ansible.builtin.set_fact:
        jellyglance_scenario: exactly-one
        jellyglance_expected_rejection: false

    - name: Scenario 4a - create exactly-one-secret directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0700"
      loop:
        - "{{ jellyglance_secret_root }}"
        - "{{ jellyglance_scenario_root }}/evidence"

    - name: Scenario 4a - seed only JWT secret
      ansible.builtin.copy:
        content: "{{ jellyglance_exactly_one_fixture }}\n"
        dest: "{{ jellyglance_jwt_path }}"
        mode: "0600"
      no_log: true

    - name: Scenario 4a - hash the lone secret
      ansible.builtin.stat:
        path: "{{ jellyglance_jwt_path }}"
        checksum_algorithm: sha256
      register: jellyglance_exactly_one_before

    - name: Scenario 4a - exactly one secret fails closed
      block:
        - name: Scenario 4a - invoke role
          ansible.builtin.include_role:
            name: jellyglance
            tasks_from: "{{ jellyglance_test_phase.file }}"
            apply:
              no_log: "{{ jellyglance_test_phase.no_log }}"
          loop:
            - file: preflight
              no_log: false
            - file: secrets
              no_log: true
          loop_control:
            loop_var: jellyglance_test_phase
          vars:
            server_appdata_path: "{{ jellyglance_scenario_root }}"
            jellyglance_evidence_dir: "{{ jellyglance_scenario_root }}/evidence"
      rescue:
        - name: Scenario 4a - record expected rejection
          ansible.builtin.set_fact:
            jellyglance_expected_rejection: true
            jellyglance_rejection_category: "{{ ansible_failed_result.msg | default('') }}"
          no_log: true

    - name: Scenario 4a - inspect state after rejection
      ansible.builtin.stat:
        path: "{{ item }}"
        checksum_algorithm: sha256
        follow: false
      loop:
        - "{{ jellyglance_jwt_path }}"
        - "{{ jellyglance_postgres_path }}"
        - "{{ jellyglance_secret_root }}/config"
        - "{{ jellyglance_secret_root }}/backups"
        - "{{ jellyglance_secret_root }}/postgres"
      register: jellyglance_exactly_one_after

    - name: Scenario 4a - rejection must not mutate partial state
      ansible.builtin.assert:
        that:
          - jellyglance_expected_rejection
          - jellyglance_rejection_category is regex('(?i).*(partial|exactly one|secret pair).*')
          - jellyglance_exactly_one_after.results[0].stat.checksum == jellyglance_exactly_one_before.stat.checksum
          - not jellyglance_exactly_one_after.results[1].stat.exists
          - not jellyglance_exactly_one_after.results[2].stat.exists
          - not jellyglance_exactly_one_after.results[3].stat.exists
          - not jellyglance_exactly_one_after.results[4].stat.exists
        fail_msg: exactly-one-secret rejection category or state preservation failed

    - name: Scenario 4b - select malformed-secret state
      ansible.builtin.set_fact:
        jellyglance_scenario: malformed
        jellyglance_expected_rejection: false

    - name: Scenario 4b - create malformed-secret directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0700"
      loop:
        - "{{ jellyglance_secret_root }}"
        - "{{ jellyglance_scenario_root }}/evidence"

    - name: Scenario 4b - seed malformed and valid files
      ansible.builtin.copy:
        content: "{{ item.value }}\n"
        dest: "{{ item.path }}"
        mode: "0600"
      loop:
        - path: "{{ jellyglance_jwt_path }}"
          value: not-a-valid-secret
        - path: "{{ jellyglance_postgres_path }}"
          value: "{{ jellyglance_malformed_valid_fixture }}"
      no_log: true

    - name: Scenario 4b - hash malformed state
      ansible.builtin.stat:
        path: "{{ item }}"
        checksum_algorithm: sha256
      loop:
        - "{{ jellyglance_jwt_path }}"
        - "{{ jellyglance_postgres_path }}"
      register: jellyglance_malformed_before

    - name: Scenario 4b - malformed secret fails closed
      block:
        - name: Scenario 4b - invoke role
          ansible.builtin.include_role:
            name: jellyglance
            tasks_from: "{{ jellyglance_test_phase.file }}"
            apply:
              no_log: "{{ jellyglance_test_phase.no_log }}"
          loop:
            - file: preflight
              no_log: false
            - file: secrets
              no_log: true
          loop_control:
            loop_var: jellyglance_test_phase
          vars:
            server_appdata_path: "{{ jellyglance_scenario_root }}"
            jellyglance_evidence_dir: "{{ jellyglance_scenario_root }}/evidence"
      rescue:
        - name: Scenario 4b - record expected rejection
          ansible.builtin.set_fact:
            jellyglance_expected_rejection: true
            jellyglance_rejection_category: "{{ ansible_failed_result.msg | default('') }}"
          no_log: true

    - name: Scenario 4b - inspect malformed state after rejection
      ansible.builtin.stat:
        path: "{{ item }}"
        checksum_algorithm: sha256
      loop:
        - "{{ jellyglance_jwt_path }}"
        - "{{ jellyglance_postgres_path }}"
        - "{{ jellyglance_secret_root }}/config"
        - "{{ jellyglance_secret_root }}/backups"
        - "{{ jellyglance_secret_root }}/postgres"
      register: jellyglance_malformed_after

    - name: Scenario 4b - malformed rejection must not mutate either file
      ansible.builtin.assert:
        that:
          - jellyglance_expected_rejection
          - jellyglance_rejection_category is regex('(?i).*(malformed|format|encoding).*')
          - jellyglance_malformed_after.results[0].stat.checksum == jellyglance_malformed_before.results[0].stat.checksum
          - jellyglance_malformed_after.results[1].stat.checksum == jellyglance_malformed_before.results[1].stat.checksum
          - not jellyglance_malformed_after.results[2].stat.exists
          - not jellyglance_malformed_after.results[3].stat.exists
          - not jellyglance_malformed_after.results[4].stat.exists
        fail_msg: malformed-secret rejection category or state preservation failed

    - name: Scenario 4c - select symlinked-secret state
      ansible.builtin.set_fact:
        jellyglance_scenario: symlinked
        jellyglance_expected_rejection: false

    - name: Scenario 4c - create symlinked-secret directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0700"
      loop:
        - "{{ jellyglance_secret_root }}"
        - "{{ jellyglance_scenario_root }}/evidence"

    - name: Scenario 4c - create symlinked JWT secret
      ansible.builtin.file:
        src: /dev/null
        dest: "{{ jellyglance_jwt_path }}"
        state: link

    - name: Scenario 4c - seed companion PostgreSQL secret
      ansible.builtin.copy:
        content: "{{ jellyglance_symlink_fixture }}\n"
        dest: "{{ jellyglance_postgres_path }}"
        mode: "0600"
      no_log: true

    - name: Scenario 4c - hash companion secret
      ansible.builtin.stat:
        path: "{{ jellyglance_postgres_path }}"
        checksum_algorithm: sha256
      register: jellyglance_symlink_before

    - name: Scenario 4c - symlinked secret fails closed
      block:
        - name: Scenario 4c - invoke role
          ansible.builtin.include_role:
            name: jellyglance
            tasks_from: "{{ jellyglance_test_phase.file }}"
            apply:
              no_log: "{{ jellyglance_test_phase.no_log }}"
          loop:
            - file: preflight
              no_log: false
            - file: secrets
              no_log: true
          loop_control:
            loop_var: jellyglance_test_phase
          vars:
            server_appdata_path: "{{ jellyglance_scenario_root }}"
            jellyglance_evidence_dir: "{{ jellyglance_scenario_root }}/evidence"
      rescue:
        - name: Scenario 4c - record expected rejection
          ansible.builtin.set_fact:
            jellyglance_expected_rejection: true
            jellyglance_rejection_category: "{{ ansible_failed_result.msg | default('') }}"
          no_log: true

    - name: Scenario 4c - inspect symlinked state after rejection
      ansible.builtin.stat:
        path: "{{ item }}"
        checksum_algorithm: sha256
        follow: false
      loop:
        - "{{ jellyglance_jwt_path }}"
        - "{{ jellyglance_postgres_path }}"
        - "{{ jellyglance_secret_root }}/config"
        - "{{ jellyglance_secret_root }}/backups"
        - "{{ jellyglance_secret_root }}/postgres"
      register: jellyglance_symlink_after

    - name: Scenario 4c - symlink rejection must preserve both paths
      ansible.builtin.assert:
        that:
          - jellyglance_expected_rejection
          - jellyglance_rejection_category is regex('(?i).*(symlink|regular file|file type).*')
          - jellyglance_symlink_after.results[0].stat.islnk
          - jellyglance_symlink_after.results[1].stat.checksum == jellyglance_symlink_before.stat.checksum
          - not jellyglance_symlink_after.results[2].stat.exists
          - not jellyglance_symlink_after.results[3].stat.exists
          - not jellyglance_symlink_after.results[4].stat.exists
        fail_msg: symlink rejection category or state preservation failed

    - name: Scenario 5 - select permissive-mode state
      ansible.builtin.set_fact:
        jellyglance_scenario: permissive-mode

    - name: Scenario 5 - create permissive-mode directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0700"
      loop:
        - "{{ jellyglance_secret_root }}"
        - "{{ jellyglance_scenario_root }}/evidence"

    - name: Scenario 5 - seed valid overly broad secret modes
      ansible.builtin.copy:
        content: "{{ item.value }}\n"
        dest: "{{ item.path }}"
        mode: "{{ item.mode }}"
      loop:
        - path: "{{ jellyglance_jwt_path }}"
          value: "{{ jellyglance_mode_jwt }}"
          mode: "0700"
        - path: "{{ jellyglance_postgres_path }}"
          value: "{{ jellyglance_mode_postgres }}"
          mode: "0644"
      no_log: true

    - name: Scenario 5 - hash permissive secrets before repair
      ansible.builtin.stat:
        path: "{{ item }}"
        checksum_algorithm: sha256
      loop:
        - "{{ jellyglance_jwt_path }}"
        - "{{ jellyglance_postgres_path }}"
      register: jellyglance_mode_before

    - name: Scenario 5 - repair valid overly broad permissions
      ansible.builtin.include_role:
        name: jellyglance
        tasks_from: "{{ jellyglance_test_phase.file }}"
        apply:
          no_log: "{{ jellyglance_test_phase.no_log }}"
      loop:
        - file: preflight
          no_log: false
        - file: secrets
          no_log: true
      loop_control:
        loop_var: jellyglance_test_phase
      vars:
        server_appdata_path: "{{ jellyglance_scenario_root }}"
        jellyglance_evidence_dir: "{{ jellyglance_scenario_root }}/evidence"

    - name: Scenario 5 - inspect repaired secrets
      ansible.builtin.stat:
        path: "{{ item }}"
        checksum_algorithm: sha256
      loop:
        - "{{ jellyglance_jwt_path }}"
        - "{{ jellyglance_postgres_path }}"
      register: jellyglance_mode_after

    - name: Scenario 5 - repair mode without changing content
      ansible.builtin.assert:
        that:
          - jellyglance_mode_after.results[0].stat.mode == '0600'
          - jellyglance_mode_after.results[1].stat.mode == '0600'
          - jellyglance_mode_after.results[0].stat.checksum == jellyglance_mode_before.results[0].stat.checksum
          - jellyglance_mode_after.results[1].stat.checksum == jellyglance_mode_before.results[1].stat.checksum
        fail_msg: permission repair changed a secret or left a permissive mode

    - name: Scenario 6a - select protected-env collision state
      ansible.builtin.set_fact:
        jellyglance_scenario: protected-env
        jellyglance_expected_rejection: false

    - name: Scenario 6a - create evidence directory
      ansible.builtin.file:
        path: "{{ jellyglance_scenario_root }}/evidence"
        state: directory
        mode: "0700"

    - name: Scenario 6a - protected environment collision fails
      block:
        - name: Scenario 6a - invoke role with protected custom key
          ansible.builtin.include_role:
            name: jellyglance
            tasks_from: "{{ jellyglance_test_phase.file }}"
            apply:
              no_log: "{{ jellyglance_test_phase.no_log }}"
          loop:
            - file: preflight
              no_log: false
            - file: secrets
              no_log: true
          loop_control:
            loop_var: jellyglance_test_phase
          vars:
            server_appdata_path: "{{ jellyglance_scenario_root }}"
            jellyglance_evidence_dir: "{{ jellyglance_scenario_root }}/evidence"
            jellyglance_role_docker_envs_custom:
              JWT_SECRET: "{{ jellyglance_collision_secret }}"
      rescue:
        - name: Scenario 6a - record expected rejection
          ansible.builtin.set_fact:
            jellyglance_expected_rejection: true
            jellyglance_rejection_category: "{{ ansible_failed_result.msg | default('') }}"
          no_log: true

    - name: Scenario 6a - inspect protected-env state after rejection
      ansible.builtin.stat:
        path: "{{ item }}"
        follow: false
      loop:
        - "{{ jellyglance_secret_root }}"
        - "{{ jellyglance_secret_root }}/config"
        - "{{ jellyglance_secret_root }}/backups"
        - "{{ jellyglance_secret_root }}/postgres"
      register: jellyglance_protected_env_after

    - name: Scenario 6a - require protected environment rejection
      ansible.builtin.assert:
        that:
          - jellyglance_expected_rejection
          - jellyglance_rejection_category is regex('(?i).*(protected environment|environment.*collision|collision.*environment).*')
          - jellyglance_protected_env_after.results | map(attribute='stat.exists') | select('equalto', true) | list | length == 0
        fail_msg: protected environment rejection category or state preservation failed

    - name: Scenario 6b - select protected-volume collision state
      ansible.builtin.set_fact:
        jellyglance_scenario: protected-volume
        jellyglance_expected_rejection: false

    - name: Scenario 6b - create evidence directory
      ansible.builtin.file:
        path: "{{ jellyglance_scenario_root }}/evidence"
        state: directory
        mode: "0700"

    - name: Scenario 6b - protected volume collision fails
      block:
        - name: Scenario 6b - invoke role with protected custom target
          ansible.builtin.include_role:
            name: jellyglance
            tasks_from: "{{ jellyglance_test_phase.file }}"
            apply:
              no_log: "{{ jellyglance_test_phase.no_log }}"
          loop:
            - file: preflight
              no_log: false
            - file: secrets
              no_log: true
          loop_control:
            loop_var: jellyglance_test_phase
          vars:
            server_appdata_path: "{{ jellyglance_scenario_root }}"
            jellyglance_evidence_dir: "{{ jellyglance_scenario_root }}/evidence"
            jellyglance_role_docker_volumes_custom:
              - /tmp/forbidden-test-config:/app/config:ro,z
      rescue:
        - name: Scenario 6b - record expected rejection
          ansible.builtin.set_fact:
            jellyglance_expected_rejection: true
            jellyglance_rejection_category: "{{ ansible_failed_result.msg | default('') }}"
          no_log: true

    - name: Scenario 6b - inspect protected-volume state after rejection
      ansible.builtin.stat:
        path: "{{ item }}"
        follow: false
      loop:
        - "{{ jellyglance_secret_root }}"
        - "{{ jellyglance_secret_root }}/config"
        - "{{ jellyglance_secret_root }}/backups"
        - "{{ jellyglance_secret_root }}/postgres"
      register: jellyglance_protected_volume_after

    - name: Scenario 6b - require protected volume rejection
      ansible.builtin.assert:
        that:
          - jellyglance_expected_rejection
          - jellyglance_rejection_category is regex('(?i).*(protected volume|volume.*collision|collision.*volume).*')
          - jellyglance_protected_volume_after.results | map(attribute='stat.exists') | select('equalto', true) | list | length == 0
        fail_msg: protected volume rejection category or state preservation failed

    - name: Scenario 7 - select non-CI test-mode state
      ansible.builtin.set_fact:
        jellyglance_scenario: non-ci-test-mode
        jellyglance_expected_rejection: false

    - name: Scenario 7 - test mode outside CI fails closed
      block:
        - name: Scenario 7 - invoke role with invalid test-mode gate
          ansible.builtin.include_role:
            name: jellyglance
            tasks_from: "{{ jellyglance_test_phase.file }}"
            apply:
              no_log: "{{ jellyglance_test_phase.no_log }}"
          loop:
            - file: preflight
              no_log: false
            - file: secrets
              no_log: true
          loop_control:
            loop_var: jellyglance_test_phase
          vars:
            server_appdata_path: "{{ jellyglance_scenario_root }}"
            jellyglance_evidence_dir: "{{ jellyglance_scenario_root }}/evidence"
            jellyglance_test_mode: true
            continuous_integration: false
      rescue:
        - name: Scenario 7 - record expected rejection
          ansible.builtin.set_fact:
            jellyglance_expected_rejection: true
            jellyglance_rejection_category: "{{ ansible_failed_result.msg | default('') }}"
          no_log: true

    - name: Scenario 7 - inspect non-CI test-mode state after rejection
      ansible.builtin.stat:
        path: "{{ jellyglance_scenario_root }}"
        follow: false
      register: jellyglance_non_ci_after

    - name: Scenario 7 - require test-mode gate before mutation
      ansible.builtin.assert:
        that:
          - jellyglance_expected_rejection
          - jellyglance_rejection_category is regex('(?i).*test mode.*continuous.integration.*')
          - not jellyglance_non_ci_after.stat.exists
        fail_msg: non-CI test mode rejection category or state preservation failed

    - name: Scenario 8 - select extra-newline secret state
      ansible.builtin.set_fact:
        jellyglance_scenario: extra-newline
        jellyglance_expected_rejection: false

    - name: Scenario 8 - create extra-newline directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0700"
      loop:
        - "{{ jellyglance_secret_root }}"
        - "{{ jellyglance_scenario_root }}/evidence"

    - name: Scenario 8 - seed secret pair with one extra newline
      ansible.builtin.copy:
        content: "{{ item.value }}"
        dest: "{{ item.path }}"
        mode: "0600"
      loop:
        - path: "{{ jellyglance_jwt_path }}"
          value: "{{ jellyglance_malformed_valid_fixture }}\n\n"
        - path: "{{ jellyglance_postgres_path }}"
          value: "{{ jellyglance_symlink_fixture }}\n"
      no_log: true

    - name: Scenario 8 - hash extra-newline state
      ansible.builtin.stat:
        path: "{{ item }}"
        checksum_algorithm: sha256
      loop:
        - "{{ jellyglance_jwt_path }}"
        - "{{ jellyglance_postgres_path }}"
      register: jellyglance_extra_newline_before

    - name: Scenario 8 - extra newline fails closed
      block:
        - name: Scenario 8 - invoke preflight directly
          ansible.builtin.include_role:
            name: jellyglance
            tasks_from: preflight
          vars:
            server_appdata_path: "{{ jellyglance_scenario_root }}"
            jellyglance_evidence_dir: "{{ jellyglance_scenario_root }}/evidence"
      rescue:
        - name: Scenario 8 - record expected rejection
          ansible.builtin.set_fact:
            jellyglance_expected_rejection: true
            jellyglance_rejection_category: "{{ ansible_failed_result.msg | default('') }}"
          no_log: true

    - name: Scenario 8 - inspect extra-newline state after rejection
      ansible.builtin.stat:
        path: "{{ item }}"
        checksum_algorithm: sha256
      loop:
        - "{{ jellyglance_jwt_path }}"
        - "{{ jellyglance_postgres_path }}"
      register: jellyglance_extra_newline_after

    - name: Scenario 8 - require raw-byte rejection without mutation
      ansible.builtin.assert:
        that:
          - jellyglance_expected_rejection
          - jellyglance_rejection_category is regex('(?i).*(malformed|format|encoding).*')
          - jellyglance_extra_newline_after.results[0].stat.checksum == jellyglance_extra_newline_before.results[0].stat.checksum
          - jellyglance_extra_newline_after.results[1].stat.checksum == jellyglance_extra_newline_before.results[1].stat.checksum
        fail_msg: extra-newline rejection category or state preservation failed

    - name: Scenario 9 - select second-install failure state
      ansible.builtin.set_fact:
        jellyglance_scenario: second-install-failure
        jellyglance_expected_rejection: false

    - name: Scenario 9 - create empty existing state directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0700"
      loop:
        - "{{ jellyglance_secret_root }}/config"
        - "{{ jellyglance_secret_root }}/backups"
        - "{{ jellyglance_secret_root }}/postgres"
        - "{{ jellyglance_scenario_root }}/evidence"

    - name: Scenario 9 - inject failure after first exclusive install
      block:
        - name: Scenario 9 - invoke secret phases with fault injection
          ansible.builtin.include_role:
            name: jellyglance
            tasks_from: "{{ jellyglance_test_phase.file }}"
            apply:
              no_log: "{{ jellyglance_test_phase.no_log }}"
          loop:
            - file: preflight
              no_log: false
            - file: secrets
              no_log: true
          loop_control:
            loop_var: jellyglance_test_phase
          vars:
            server_appdata_path: "{{ jellyglance_scenario_root }}"
            jellyglance_evidence_dir: "{{ jellyglance_scenario_root }}/evidence"
            jellyglance_test_init_jwt_secret: "{{ jellyglance_fixture_init_jwt_secret }}"
            jellyglance_test_init_postgres_password: "{{ jellyglance_fixture_init_postgres_password }}"
            jellyglance_test_fail_second_install: true
      rescue:
        - name: Scenario 9 - record injected rejection
          ansible.builtin.set_fact:
            jellyglance_expected_rejection: true

    - name: Scenario 9 - inspect failed installation state
      ansible.builtin.stat:
        path: "{{ item }}"
        follow: false
      loop:
        - "{{ jellyglance_jwt_path }}"
        - "{{ jellyglance_postgres_path }}"
        - "{{ jellyglance_secret_root }}/config"
        - "{{ jellyglance_secret_root }}/backups"
        - "{{ jellyglance_secret_root }}/postgres"
        - "{{ jellyglance_secret_root }}/.secret-init.lock"
      register: jellyglance_second_install_after

    - name: Scenario 9 - require owned rollback and preserved empty directories
      ansible.builtin.assert:
        that:
          - jellyglance_expected_rejection
          - not jellyglance_second_install_after.results[0].stat.exists
          - not jellyglance_second_install_after.results[1].stat.exists
          - jellyglance_second_install_after.results[2].stat.isdir
          - jellyglance_second_install_after.results[3].stat.isdir
          - jellyglance_second_install_after.results[4].stat.isdir
          - not jellyglance_second_install_after.results[5].stat.exists
        fail_msg: second-install failure did not rollback only owned secret files

    - name: Scenario 10 - select valid DNS fixture state
      ansible.builtin.set_fact:
        jellyglance_scenario: valid-dns-fixture

    - name: Scenario 10 - create evidence directory
      ansible.builtin.file:
        path: "{{ jellyglance_scenario_root }}/evidence"
        state: directory
        mode: "0700"

    - name: Scenario 10 - accept normalized A and AAAA fixtures
      ansible.builtin.include_role:
        name: jellyglance
        tasks_from: preflight
      vars:
        server_appdata_path: "{{ jellyglance_scenario_root }}"
        jellyglance_evidence_dir: "{{ jellyglance_scenario_root }}/evidence"
        jellyglance_test_dns_records:
          - name: jellyglance.example.invalid
            type: A
            content: 192.0.2.10
            proxied: false
          - name: jellyglance.example.invalid
            type: AAAA
            content: 2001:db8::10
            proxied: false

    - name: Scenario 10 - require schema-identical normalized DNS facts
      ansible.builtin.assert:
        that:
          - jellyglance_dns_records_before | length == 2
          - jellyglance_dns_records_before[0].keys() | sort == ['content', 'name', 'proxied', 'type']
          - jellyglance_dns_records_before[1].keys() | sort == ['content', 'name', 'proxied', 'type']
        fail_msg: DNS fixture schema was not preserved

    - name: Scenario 11 - select conflicting DNS fixture state
      ansible.builtin.set_fact:
        jellyglance_scenario: conflicting-dns-fixture
        jellyglance_expected_rejection: false

    - name: Scenario 11 - create evidence directory
      ansible.builtin.file:
        path: "{{ jellyglance_scenario_root }}/evidence"
        state: directory
        mode: "0700"

    - name: Scenario 11 - conflicting CNAME fixture fails closed
      block:
        - name: Scenario 11 - invoke preflight with CNAME fixture
          ansible.builtin.include_role:
            name: jellyglance
            tasks_from: preflight
          vars:
            server_appdata_path: "{{ jellyglance_scenario_root }}"
            jellyglance_evidence_dir: "{{ jellyglance_scenario_root }}/evidence"
            jellyglance_test_dns_records:
              - name: jellyglance.example.invalid
                type: CNAME
                content: conflict.example.invalid
                proxied: false
      rescue:
        - name: Scenario 11 - record expected DNS rejection
          ansible.builtin.set_fact:
            jellyglance_expected_rejection: true
            jellyglance_rejection_category: "{{ ansible_failed_result.msg | default('') }}"
          no_log: true

    - name: Scenario 11 - require stable conflicting DNS category
      ansible.builtin.assert:
        that:
          - jellyglance_expected_rejection
          - jellyglance_rejection_category is regex('(?i).*conflicting.*DNS.*record.*')
        fail_msg: conflicting DNS fixture was accepted

    - name: Report behavioral scenario completion
      ansible.builtin.debug:
        msg: JellyGlance secret-state and test-mode scenarios passed
